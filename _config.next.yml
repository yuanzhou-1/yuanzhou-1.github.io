# NexT 主题配置
# 只需把想自定义的选项写在这里，会覆盖主题自带的 _config.yml
# 完整配置参考 node_modules/hexo-theme-next/_config.yml
# 文档：https://theme-next.js.org/docs/

# ---------------------------------------------------------------
# 外观方案：Muse | Mist | Pisces | Gemini（从左到右功能递增，Gemini 最华丽）
scheme: Gemini

# 侧边栏
sidebar:
  avatar: ''          # 头像图片链接，留空则不显示
  position: left

# 页脚显示「本站已运行 X 天」需要备案号等，这里先保持简单
footer:
  since: 2026
